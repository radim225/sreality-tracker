name: Scrape Sreality

on:
  schedule:
    # Každé 4 hodiny místo osmi (Radim, 28. 8.): odkaz na inzerát, který
    # mezitím zmizel, je nejviditelnější vada dashboardu, a osmihodinové okno
    # ji dělá zbytečně širokou. Běh sám je levný -- detaily se kešují a
    # znovu se čtou jen u toho, co se změnilo, takže dvojnásobná frekvence
    # neznamená dvojnásobek requestů na Sreality.
    - cron: "0 */4 * * *"
  workflow_dispatch:
    inputs:
      add_url:
        description: "Sreality listing URL to add to tracked.json before scraping"
        required: false
        default: ""
      remove_url:
        description: "Sreality listing URL (or numeric id) to remove from tracked.json before scraping"
        required: false
        default: ""
      override_set:
        description: "JSON object to write into overrides.json before scraping ({id, optional floor_area_sqm, fees_czk, exclude_from_stats, note})"
        required: false
        default: ""
      override_delete:
        description: "Listing id (Sreality / bez-… / idnes-…) to remove from overrides.json before scraping"
        required: false
        default: ""
      max_detail_fetches:
        description: "One-off ceiling on Sreality detail fetches (blank = default 300). Raise for a backfill after a PARSER_VERSION bump."
        required: false
        default: ""
      max_source_detail_fetches:
        description: "One-off ceiling per extra source (blank = default 200)."
        required: false
        default: ""
      max_garage_detail_fetches:
        description: "One-off ceiling on garage detail reads (blank = default 40). Raise it for the first pass after the description rules change."
        required: false
        default: ""
      max_reenrich:
        description: "One-off ceiling on re-reads of already-cached listings (blank = default 60). A PARSER_VERSION bump needs this raised too, or the backfill trickles at 60/run."
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    # A steady run is ~6 min. The ceiling is generous because a backfill run
    # after a PARSER_VERSION bump re-reads every cached listing, and Sreality
    # serves that burst at ~1 s each when it is happy and ~7 s inside a
    # throttling window -- one such run was measured locally at well over an
    # hour. Cron is every 8 h and the concurrency group prevents overlap, so a
    # two-hour ceiling costs nothing and stops a backfill being killed halfway.
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # workflow_dispatch pins github.sha at dispatch time; a run that sat in
          # the concurrency queue would otherwise start from a stale commit and
          # its push would be rejected as non-fast-forward.
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Add tracked listing (if requested)
        if: github.event.inputs.add_url != ''
        env:
          ADD_URL: ${{ github.event.inputs.add_url }}
        run: python add_tracked.py "$ADD_URL"

      - name: Remove tracked listing (if requested)
        if: github.event.inputs.remove_url != ''
        env:
          REMOVE_URL: ${{ github.event.inputs.remove_url }}
        run: python remove_tracked.py "$REMOVE_URL"

      - name: Set listing override (if requested)
        if: github.event.inputs.override_set != ''
        env:
          OVERRIDE_SET: ${{ github.event.inputs.override_set }}
        run: python set_override.py

      - name: Delete listing override (if requested)
        if: github.event.inputs.override_delete != ''
        env:
          OVERRIDE_DELETE: ${{ github.event.inputs.override_delete }}
        run: python delete_override.py

      # Offline and fast. Run before the scrape so a broken parser or cache
      # stops the run instead of writing a snapshot full of wrong fees.
      - name: Run tests
        env:
          # Tests never touch Nominatim; geocode.py reads only its cache.
          GEOCODE_DISABLED: "1"
        run: |
          python test_fees.py
          python test_fee_queue.py
          python test_overrides.py
          python test_parking.py
          python test_own_card.py
          python test_search_paging.py
          python test_garages.py
          python test_cache.py
          python test_pool.py
          python test_market.py
          python test_report.py
          python test_notify.py
          python test_security.py
          python test_sale_extras.py
          python test_relist.py
          python test_gone_archive.py
          python test_geocode.py
          python test_areas.py
          python test_ribbon.py

      - name: Run scraper
        env:
          # The weekly write-up and the notification run at the end of the
          # scrape, so their configuration lives on this step. Every one of
          # these is optional: without them the scrape and the report still
          # run, the notification just warns that it has nowhere to go.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          # Private: the payment never reaches the dashboard or the archive,
          # only the notification (R-5.6, R-10.1). Hence a secret rather than a
          # constant in this public repo.
          MORTGAGE_PAYMENT_CZK: ${{ secrets.MORTGAGE_PAYMENT_CZK }}
          # OWN_* personal finance is intentionally NOT passed here. Those
          # secrets used to be injected into scrape.py, which wrote ownCard
          # into dashboard.html / index.html — the public Pages artefact.
          # A GitHub Secret is not private once it is in a committed HTML file.
          # The public dashboard keeps listings, overrides, estimates and
          # market stats; the personal portfolio card does not publish.
          MAX_DETAIL_FETCHES: ${{ github.event.inputs.max_detail_fetches }}
          MAX_SOURCE_DETAIL_FETCHES: ${{ github.event.inputs.max_source_detail_fetches }}
          MAX_REENRICH: ${{ github.event.inputs.max_reenrich }}
          MAX_GARAGE_DETAIL_FETCHES: ${{ github.event.inputs.max_garage_detail_fetches }}
        run: python scrape.py

      - name: Mirror dashboard as Pages index
        run: cp dashboard.html index.html

      - name: Guard public Pages against personal finance
        run: |
          if grep -E -q "id=['\"]ownCard['\"]" dashboard.html index.html; then
            echo "::error::ownCard leaked into public dashboard HTML" >&2
            exit 1
          fi
          if grep -E -q "OWN_(PRICE|EXTRA_PRICES|DEPOSITS|LTV)_" dashboard.html index.html latest_snapshot.json; then
            echo "::error::OWN_* secret name leaked into a public artefact" >&2
            exit 1
          fi

      - name: Commit and push results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshots latest_snapshot.json last_changes.json changes_history.json dashboard.html index.html tracked.json overrides.json
          git add changes_log.jsonl pool reports fee_review_queue.json
          # Jen když existují: chybějící soubor by git add shodil a s ním
          # commit celého běhu (snapshot, pool, dashboard).
          for f in gone_archive.json geocode_cache.json; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update Sreality snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            # main may have moved during the ~6 min scrape (another run, or a
            # push from a dev machine). Rebase and retry; -X theirs keeps this
            # run's generated files on conflict since they are the freshest.
            for attempt in 1 2 3; do
              if git push; then
                break
              fi
              if [ "$attempt" = 3 ]; then
                echo "Push failed after 3 attempts" >&2
                exit 1
              fi
              git pull --rebase -X theirs origin main
            done
          fi
