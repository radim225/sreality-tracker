name: Ceníky developerů

# Denní snímek veřejných ceníků developerů kolem U Kříže (developers.py).
# Commituje jen developers/. Dashboard kartu překreslí nejbližší běh
# „Scrape Sreality" (každé 4 h), ten čte developers/*.json.

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Alert jen vypsat do logu, neposílat (data se uloží)"
        type: boolean
        default: false

permissions:
  contents: write

# Vlastní skupina: se scrapem se nepřekrývá souborově (ten developers/ nikdy
# necommituje), takže stačí rebase před pushem. Dva běhy ceníků naráz ale
# ne -- druhý by historii zapsal dvakrát.
concurrency:
  group: developers
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        env:
          GEOCODE_DISABLED: "1"
        run: python test_developers.py

      - name: Snapshot price lists
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python developers.py --dry-run
          else
            python developers.py
          fi

      - name: Commit and push developers/
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add developers
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Ceníky developerů $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Scrape mohl mezitím pushnout. Soubory se nepřekrývají, takže
          # rebase projde bez konfliktu; tři pokusy na souběh v téže vteřině.
          for attempt in 1 2 3; do
            if git push; then
              exit 0
            fi
            sleep $((attempt * 5))
            git pull --rebase origin main
          done
          echo "Push failed after 3 attempts" >&2
          exit 1
